services:
  pulseid-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: pulseid-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

